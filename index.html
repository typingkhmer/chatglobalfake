<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Chat - Cheat Reaksmey</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Khmer OS Battambang', 'Segoe UI', sans-serif; }
        body { background: #e7ebf0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Login Screen */
        #login-screen { position: fixed; inset: 0; background: #517da2; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-box { background: white; padding: 25px; border-radius: 15px; width: 90%; max-width: 320px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        .login-box button { background: #517da2; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        /* Header */
        header { background: #517da2; color: white; padding: 15px; font-weight: bold; text-align: center; font-size: 1.1rem; flex-shrink: 0; }
        
        /* Chat Container */
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        
        /* Messages Style */
        .message-wrapper { display: flex; flex-direction: column; max-width: 80%; position: relative; }
        .sent { align-self: flex-end; }
        .received { align-self: flex-start; }
        
        .sender-name { font-size: 11px; color: #517da2; margin-bottom: 3px; font-weight: bold; }
        .sent .sender-name { text-align: right; }

        .message { padding: 10px 14px; border-radius: 15px; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: relative; word-wrap: break-word; line-height: 1.4; cursor: pointer; }
        .sent .message { background: #effdde; border-bottom-right-radius: 2px; }
        .received .message { border-bottom-left-radius: 2px; }
        
        .msg-time { font-size: 9px; color: #888; margin-top: 5px; text-align: right; display: block; }
        
        /* Reply Preview in Message */
        .replied-box { background: rgba(0,0,0,0.05); padding: 5px 8px; border-left: 3px solid #517da2; font-size: 11px; margin-bottom: 5px; border-radius: 4px; color: #555; }

        /* Active Reply Banner (Above Input) */
        #reply-banner { display: none; background: #f1f1f1; padding: 8px 12px; font-size: 12px; border-top: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        #reply-banner span { color: #517da2; font-weight: bold; }

        /* Media Content */
        img, video { max-width: 100%; border-radius: 10px; margin-top: 5px; display: block; background: #f0f0f0; }

        /* Input Area */
        .input-area { background: white; padding: 12px; display: flex; flex-direction: column; border-top: 1px solid #ddd; }
        .input-row { display: flex; gap: 10px; align-items: center; width: 100%; }
        #msg-input { flex: 1; border: 1px solid #eee; padding: 12px; border-radius: 25px; outline: none; background: #f1f1f1; font-size: 15px; }
        .btn-send { cursor: pointer; border: none; background: none; font-size: 24px; color: #517da2; display: flex; align-items: center; }
        .btn-send:active { transform: scale(0.9); }
        .file-label { cursor: pointer; font-size: 24px; padding: 0 5px; }

        /* Loading Spinner */
        #loading-bar { display: none; background: #fff9c4; padding: 5px; text-align: center; font-size: 12px; color: #856404; border-top: 1px solid #ffeeba; }
        
        /* Action Menu Modal */
        #action-menu { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 2000; justify-content: center; align-items: center; }
        .action-box { background: white; padding: 20px; border-radius: 12px; width: 80%; max-width: 250px; display: flex; flex-direction: column; gap: 10px; text-align: center; }
        .action-box button { padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-reply-opt { background: #517da2; color: white; }
        .btn-delete-opt { background: #ff4d4d; color: white; }
        .btn-cancel-opt { background: #ddd; color: #333; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2 style="color:#517da2; margin-bottom: 10px;">ជម្រាបសួរ! 🙏</h2>
        <p style="font-size: 13px; color: #666;">សូមបញ្ចូលឈ្មោះដើម្បីចាប់ផ្តើមឆាត</p>
        <input type="text" id="login-name" placeholder="ឈ្មោះរបស់អ្នក...">
        <button onclick="login()">ចូលរួមឆាត</button>
    </div>
</div>

<header>Cheat Reaksmey Global Chat 💬</header>
<div id="loading-bar">កំពុងផ្ញើឯកសារ... សូមរង់ចាំ!</div>
<div id="chat-container"></div>

<!-- Action Menu Popup (Reply / Delete) -->
<div id="action-menu" onclick="closeActionMenu()">
    <div class="action-box" onclick="event.stopPropagation()">
        <p style="font-size: 13px; font-weight: bold; margin-bottom: 5px;">ជ្រើសរើសជម្រើស</p>
        <button class="btn-reply-opt" onclick="triggerReply()">💬 ឆ្លើយតប (Reply)</button>
        <button id="btn-del" class="btn-delete-opt" style="display:none;" onclick="triggerDelete()">🗑️ លុបចោល (Delete)</button>
        <button class="btn-cancel-opt" onclick="closeActionMenu()">បោះបង់</button>
    </div>
</div>

<div class="input-area">
    <div id="reply-banner">
        <div>កំពុងឆ្លើយតបទៅ៖ <span id="reply-to-text"></span></div>
        <span style="cursor:pointer; font-weight:bold;" onclick="cancelReply()">✕</span>
    </div>
    <div class="input-row">
        <label class="file-label">📎<input type="file" id="file-input" hidden accept="image/*,video/*" onchange="uploadFile(event)"></label>
        <input type="text" id="msg-input" placeholder="សរសេរសារ..." autocomplete="off">
        <button class="btn-send" onclick="sendMessage()">➤</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, onChildRemoved, remove } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDPZNVhZlRxPesF-ID8N9IO_zhKWZsOn48",
        authDomain: "cheatreaksmey-f197a.firebaseapp.com",
        databaseURL: "https://cheatreaksmey-f197a-default-rtdb.asia-southeast1.firebasedatabase.app/",
        projectId: "cheatreaksmey-f197a",
        storageBucket: "cheatreaksmey-f197a.firebasestorage.app",
        appId: "1:814624911892:web:b7e44ee2dd9b87b6902d01"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const chatRef = ref(db, 'global_messages');

    const CLOUD_NAME = "djz9t4aye"; 
    const UPLOAD_PRESET = "bbefttwh"; 

    let replyingTo = null; // เก็บข้อมูลข้อความที่กำลัง Reply
    let selectedMsgId = null;
    let selectedMsgSender = null;

    window.login = () => {
        const name = document.getElementById('login-name').value;
        if(name.trim()) {
            localStorage.setItem('reak_name', name);
            document.getElementById('login-screen').style.display = 'none';
        }
    };

    if(localStorage.getItem('reak_name')) document.getElementById('login-screen').style.display = 'none';

    // Send Text Function
    window.sendMessage = () => {
        const name = localStorage.getItem('reak_name');
        const input = document.getElementById('msg-input');
        if(input.value.trim()) {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            let messageData = { 
                sender: name, 
                text: input.value, 
                type: 'text', 
                time: time 
            };

            if(replyingTo) {
                messageData.replyTo = replyingTo;
            }

            push(chatRef, messageData);
            input.value = "";
            cancelReply();
        }
    };

    document.getElementById('msg-input').onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };

    // Upload File Function
    window.uploadFile = async (e) => {
        const file = e.target.files[0];
        if(!file) return;

        const name = localStorage.getItem('reak_name');
        const loadingBar = document.getElementById('loading-bar');
        const inputField = document.getElementById('msg-input');

        loadingBar.style.display = 'block';
        inputField.disabled = true;

        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', UPLOAD_PRESET);

        try {
            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, {
                method: 'POST',
                body: formData
            });

            const data = await res.json();
            
            if(data.secure_url) {
                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                let fileType = data.resource_type;
                if(fileType !== 'image' && fileType !== 'video') {
                    fileType = file.type.startsWith('video') ? 'video' : 'image';
                }
                
                let messageData = { 
                    sender: name, 
                    url: data.secure_url, 
                    type: fileType, 
                    time: time 
                };

                if(replyingTo) {
                    messageData.replyTo = replyingTo;
                }

                await push(chatRef, messageData);
                cancelReply();
            } else {
                alert("ការផ្ញើបរាជ័យ៖ " + (data.error ? data.error.message : "ពិនិត្យការកំណត់ Cloudinary"));
            }
        } catch (err) {
            console.error(err);
            alert("Network Error: ផ្ញើមិនចេញទេ!");
        } finally {
            loadingBar.style.display = 'none';
            inputField.disabled = false;
            e.target.value = ''; 
        }
    };

    // Reply Controls
    window.openActionMenu = (msgId, sender, textContent) => {
        selectedMsgId = msgId;
        selectedMsgSender = sender;
        replyingTo = textContent;

        const myName = localStorage.getItem('reak_name');
        const delBtn = document.getElementById('btn-del');
        
        // បើជាសាររបស់ខ្លួនឯង ទើបអាចលុបបាន
        if(sender === myName) {
            delBtn.style.display = 'block';
        } else {
            delBtn.style.display = 'none';
        }

        document.getElementById('action-menu').style.display = 'flex';
    };

    window.closeActionMenu = () => {
        document.getElementById('action-menu').style.display = 'none';
    };

    window.triggerReply = () => {
        document.getElementById('reply-to-text').innerText = `${selectedMsgSender}: "${replyingTo}"`;
        document.getElementById('reply-banner').style.display = 'flex';
        closeActionMenu();
        document.getElementById('msg-input').focus();
    };

    window.cancelReply = () => {
        replyingTo = null;
        document.getElementById('reply-banner').style.display = 'none';
    };

    // Delete Message Function (Delete for Everyone)
    window.triggerDelete = () => {
        if(selectedMsgId) {
            const msgRef = ref(db, `global_messages/${selectedMsgId}`);
            remove(msgRef).then(() => {
                closeActionMenu();
            }).catch((err) => {
                alert("លុបមិនបានទេ៖ " + err.message);
            });
        }
    };

    // Listen for Messages Added
    onChildAdded(chatRef, (snapshot) => {
        const data = snapshot.val();
        const msgId = snapshot.key;
        const myName = localStorage.getItem('reak_name');
        const isMe = data.sender === myName;
        
        const container = document.getElementById('chat-container');
        const div = document.createElement('div');
        div.className = `message-wrapper ${isMe ? 'sent' : 'received'}`;
        div.id = `msg-${msgId}`;
        
        let content = `<div class="sender-name">${isMe ? 'ខ្ញុំ' : data.sender}</div>`;
        content += `<div class="message" onclick="openActionMenu('${msgId}', '${data.sender}', '${data.text ? data.text.replace(/'/g, "\\'") : (data.type === 'image' ? '[រូបភាព]' : '[វីដេអូ]')}')">`;
        

        if(data.replyTo) {
            content += `<div class="replied-box">↩ តបទៅ៖ ${data.replyTo}</div>`;
        }

        if(data.type === 'text') {
            content += `<span>${data.text}</span>`;
        } else if(data.type === 'image') {
            content += `<img src="${data.url}" loading="lazy" onclick="event.stopPropagation(); window.open('${data.url}', '_blank')">`;
        } else if(data.type === 'video') {
            content += `<video src="${data.url}" controls></video>`;
        }
        
        content += `<span class="msg-time">${data.time || ''}</span></div>`;
        div.innerHTML = content;
        
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    });


    onChildRemoved(chatRef, (snapshot) => {
        const msgId = snapshot.key;
        const msgElement = document.getElementById(`msg-${msgId}`);
        if(msgElement) {
            msgElement.remove();
        }
    });
</script>
</body>
</html>
