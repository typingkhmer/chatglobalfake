<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Chat -Reaksmey</title>
    <style>
       
        :root {
            --primary-color: #517da2;
            --bg-color: #e7ebf0;
            --chat-bg: white;
            --text-color: #333;
            --sent-bg: #effdde;
            --received-bg: white;
            --input-bg: #f1f1f1;
            --border-color: #ddd;
        }

      
        body.theme-blue { --primary-color: #517da2; --sent-bg: #effdde; }
        body.theme-green { --primary-color: #2e7d32; --sent-bg: #e8f5e9; }
        body.theme-orange { --primary-color: #ef6c00; --sent-bg: #fff3e0; }
        body.theme-dark { 
            --primary-color: #37474f; 
            --bg-color: #121212; 
            --chat-bg: #1e1e1e; 
            --text-color: #e0e0e0; 
            --sent-bg: #004d40; 
            --received-bg: #2d2d2d; 
            --input-bg: #2c2c2c; 
            --border-color: #444; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Khmer OS Battambang', 'Segoe UI', sans-serif; }
        body { background: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; overflow: hidden; transition: background 0.3s, color 0.3s; }
        
        #login-screen { position: fixed; inset: 0; background: var(--primary-color); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-box { background: var(--chat-bg); color: var(--text-color); padding: 25px; border-radius: 15px; width: 90%; max-width: 320px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); border-radius: 8px; outline: none; }
        .login-box button { background: var(--primary-color); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        .profile-upload-container { position: relative; width: 80px; height: 80px; margin: 0 auto 15px auto; cursor: pointer; }
        .profile-upload-container img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px dashed var(--primary-color); background: #f0f0f0; }
        .profile-upload-container input { display: none; }
        .profile-upload-hint { font-size: 11px; color: var(--text-color); opacity: 0.8; margin-bottom: 5px; }

        header { background: var(--primary-color); color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; transition: background 0.3s; }
        .header-left { display: flex; flex-direction: column; }
        .header-title { font-weight: bold; font-size: 1rem; }
        .online-counter { font-size: 11px; color: #d4edda; display: flex; align-items: center; gap: 4px; margin-top: 2px; }
        .online-dot { width: 8px; height: 8px; background-color: #28a745; border-radius: 50%; display: inline-block; animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(40, 167, 69, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
        }

        .header-right-group { display: flex; align-items: center; gap: 8px; }
        .theme-toggle-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 10px; border-radius: 15px; cursor: pointer; font-size: 12px; font-weight: bold; }

        .my-profile-btn { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.2); padding: 5px 10px; border-radius: 20px; cursor: pointer; }
        .my-profile-btn img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1px solid white; background: white; }
        .my-profile-btn span { font-size: 12px; font-weight: bold; color: white; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        
        .message-row { display: flex; gap: 8px; align-items: flex-end; max-width: 85%; }
        .sent-row { align-self: flex-end; flex-direction: row-reverse; }
        .received-row { align-self: flex-start; }

        .chat-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; cursor: pointer; flex-shrink: 0; background: #ddd; }

        .message-wrapper { display: flex; flex-direction: column; max-width: 100%; position: relative; }
        .sent-row .message-wrapper { align-items: flex-end; }
        
        .sender-name { font-size: 11px; color: var(--primary-color); margin-bottom: 3px; font-weight: bold; cursor: pointer; }
        .sent-row .sender-name { text-align: right; }

        .message { padding: 10px 14px; border-radius: 15px; background: var(--received-bg); color: var(--text-color); box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: relative; word-wrap: break-word; line-height: 1.4; cursor: pointer; }
        .sent-row .message { background: var(--sent-bg); border-bottom-right-radius: 2px; border-bottom-left-radius: 15px; }
        .received-row .message { border-bottom-left-radius: 2px; border-bottom-right-radius: 15px; }
        
        .msg-time { font-size: 9px; opacity: 0.7; margin-top: 5px; text-align: right; display: block; }
        
        .replied-box { background: rgba(0,0,0,0.05); padding: 5px 8px; border-left: 3px solid var(--primary-color); font-size: 11px; margin-bottom: 5px; border-radius: 4px; opacity: 0.9; }

        #reply-banner { display: none; background: var(--chat-bg); color: var(--text-color); padding: 8px 12px; font-size: 12px; border-top: 1px solid var(--border-color); justify-content: space-between; align-items: center; }
        #reply-banner span { color: var(--primary-color); font-weight: bold; }

        img.chat-media, video { max-width: 100%; border-radius: 10px; margin-top: 5px; display: block; background: #f0f0f0; }

        .input-area { background: var(--chat-bg); padding: 12px; display: flex; flex-direction: column; border-top: 1px solid var(--border-color); transition: background 0.3s; }
        .input-row { display: flex; gap: 10px; align-items: center; width: 100%; }
        #msg-input { flex: 1; border: 1px solid var(--border-color); padding: 12px; border-radius: 25px; outline: none; background: var(--input-bg); color: var(--text-color); font-size: 15px; }
        .btn-send { cursor: pointer; border: none; background: none; font-size: 24px; color: var(--primary-color); display: flex; align-items: center; }
        .btn-send:active { transform: scale(0.9); }
        .file-label { cursor: pointer; font-size: 24px; padding: 0 5px; }

        #loading-bar { display: none; background: #fff9c4; padding: 5px; text-align: center; font-size: 12px; color: #856404; border-top: 1px solid #ffeeba; }
        
        #action-menu { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 2000; justify-content: center; align-items: center; }
        .action-box { background: var(--chat-bg); color: var(--text-color); padding: 20px; border-radius: 12px; width: 80%; max-width: 250px; display: flex; flex-direction: column; gap: 10px; text-align: center; }
        .action-box button { padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-reply-opt { background: var(--primary-color); color: white; }
        .btn-delete-opt { background: #ff4d4d; color: white; }
        .btn-cancel-opt { background: var(--border-color); color: var(--text-color); }

        #profile-modal, #settings-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 3000; justify-content: center; align-items: center; }
        .profile-card { background: var(--chat-bg); color: var(--text-color); padding: 25px; border-radius: 15px; width: 85%; max-width: 280px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .profile-card img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; margin-bottom: 12px; border: 3px solid var(--primary-color); background: #f0f0f0; }
        .profile-card h3 { margin-bottom: 15px; }
        .profile-card button { background: var(--primary-color); color: white; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; width: 100%; }
        .profile-card input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); border-radius: 8px; outline: none; text-align: center; }

        .theme-options { display: flex; gap: 8px; justify-content: center; margin: 10px 0; }
        .theme-circle { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

       
        .reaction-container { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
        .reaction-pill { background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 2px 6px; font-size: 11px; display: flex; align-items: center; gap: 3px; cursor: pointer; user-select: none; }
        .reaction-pill.active { background: rgba(81, 125, 162, 0.2); border-color: var(--primary-color); color: var(--primary-color); font-weight: bold; }
        #emoji-picker-menu { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 2500; justify-content: center; align-items: center; }
        .emoji-box { background: var(--chat-bg); padding: 15px 20px; border-radius: 15px; display: flex; gap: 12px; font-size: 24px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        .emoji-box span { cursor: pointer; transition: transform 0.1s; }
        .emoji-box span:hover { transform: scale(1.3); }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2 style="color:var(--primary-color); margin-bottom: 5px;">ជម្រាបសួរ! 🙏</h2>
        <p class="profile-upload-hint">ចុចលើរូបដើម្បីដាក់រូបប្រវត្តិរូបរបស់អ្នក</p>
        <div class="profile-upload-container" onclick="document.getElementById('login-avatar-input').click()">
            <img id="login-avatar-preview" src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f464.png" alt="Avatar">
            <input type="file" id="login-avatar-input" accept="image/*" onchange="previewAvatar(event, 'login-avatar-preview')">
        </div>
        <input type="text" id="login-name" placeholder="ឈ្មោះរបស់អ្នក...">
        <button onclick="login()">ចូលរួមឆាត</button>
    </div>
</div>

<header>
    <div class="header-left">
        <div class="header-title"> Reaksmey 💬</div>
        <div class="online-counter"><span class="online-dot"></span><span id="online-count">កំពុងអនឡាញ: 0 នាក់</span></div>
    </div>
    <div class="header-right-group">
        <button class="theme-toggle-btn" onclick="toggleDarkMode()">🌙 ងងឹត</button>
        <div class="my-profile-btn" onclick="openSettingsModal()">
            <img id="header-avatar" src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f464.png" alt="My Avatar">
            <span id="header-name">ឈ្មោះខ្ញុំ</span>
        </div>
    </div>
</header>

<div id="loading-bar">កំពុងផ្ញើឯកសារ... សូមរង់ចាំ!</div>
<div id="chat-container"></div>

<div id="settings-modal" onclick="closeSettingsModal()">
    <div class="profile-card" onclick="event.stopPropagation()">
        <h3 style="color:var(--primary-color); margin-bottom:10px;">កែប្រែប្រវត្តិរូប និងពណ៌</h3>
        <div class="profile-upload-container" onclick="document.getElementById('edit-avatar-input').click()">
            <img id="edit-avatar-preview" src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f464.png" alt="Avatar">
            <input type="file" id="edit-avatar-input" accept="image/*" onchange="previewAvatar(event, 'edit-avatar-preview')">
        </div>
        <input type="text" id="edit-name-input" placeholder="ឈ្មោះថ្មីរបស់អ្នក...">
        
        <p style="font-size:12px; margin-top:8px; opacity:0.8;">ជ្រើសរើសពណ៌ស្បែក៖</p>
        <div class="theme-options">
            <div class="theme-circle" style="background: #517da2;" onclick="setTheme('theme-blue')" title="ពណ៌ខៀវ"></div>
            <div class="theme-circle" style="background: #2e7d32;" onclick="setTheme('theme-green')" title="ពណ៌បៃតង"></div>
            <div class="theme-circle" style="background: #ef6c00;" onclick="setTheme('theme-orange')" title="ពណ៌ទឹកក្រូច"></div>
            <div class="theme-circle" style="background: #1e1e1e; border: 1px solid #777;" onclick="setTheme('theme-dark')" title="ពណ៌ខ្មៅ (Dark Mode)"></div>
        </div>

        <button onclick="saveProfileChanges()">រក្សាទុក</button>
        <button style="background:var(--border-color); color:var(--text-color);" onclick="closeSettingsModal()">បោះបង់</button>
    </div>
</div>

<div id="action-menu" onclick="closeActionMenu()">
    <div class="action-box" onclick="event.stopPropagation()">
        <p style="font-size: 13px; font-weight: bold; margin-bottom: 5px;">ជ្រើសរើសជម្រើស</p>
        <button class="btn-reply-opt" onclick="triggerReply()">💬 ឆ្លើយតប (Reply)</button>
        <button class="btn-reply-opt" style="background: #ff9800;" onclick="openEmojiPickerFromMenu()">😊 ដាក់ប្រតិកម្ម (React)</button>
        <button id="btn-del" class="btn-delete-opt" style="display:none;" onclick="triggerDelete()">🗑️ លុបចោល (Delete)</button>
        <button class="btn-cancel-opt" onclick="closeActionMenu()">បោះបង់</button>
    </div>
</div>

<div id="emoji-picker-menu" onclick="closeEmojiPicker()">
    <div class="emoji-box" onclick="event.stopPropagation()">
        <span onclick="addReaction('👍')">👍</span>
        <span onclick="addReaction('❤️')">❤️</span>
        <span onclick="addReaction('😂')">😂</span>
        <span onclick="addReaction('😮')">😮</span>
        <span onclick="addReaction('😢')">😢</span>
        <span onclick="addReaction('👏')">👏</span>
    </div>
</div>

<div id="profile-modal" onclick="closeProfileModal()">
    <div class="profile-card" onclick="event.stopPropagation()">
        <img id="modal-avatar" src="" alt="Profile">
        <h3 id="modal-name"></h3>
        <button onclick="closeProfileModal()">បិទ</button>
    </div>
</div>

<div class="input-area">
    <div id="reply-banner">
        <div>កំពុងឆ្លើយតបទៅ៖ <span id="reply-to-text"></span></div>
        <span style="cursor:pointer; font-weight:bold;" onclick="cancelReply()">✕</span>
    </div>
    <div class="input-row">
        <label class="file-label">📎<input type="file" id="file-input" hidden accept="image/*,video/*" onchange="uploadFile(event)"></label>
        <input type="text" id="msg-input" placeholder="សរសេរសារ..." autocomplete="off">
        <button class="btn-send" onclick="sendMessage()">➤</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, onChildRemoved, remove, set, onValue, onDisconnect, update, onChildChanged } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDPZNVhZlRxPesF-ID8N9IO_zhKWZsOn48",
        authDomain: "cheatreaksmey-f197a.firebaseapp.com",
        databaseURL: "https://cheatreaksmey-f197a-default-rtdb.asia-southeast1.firebasedatabase.app/",
        projectId: "cheatreaksmey-f197a",
        storageBucket: "cheatreaksmey-f197a.firebasestorage.app",
        appId: "1:814624911892:web:b7e44ee2dd9b87b6902d01"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const chatRef = ref(db, 'global_messages');

    const CLOUD_NAME = "djz9t4aye"; 
    const UPLOAD_PRESET = "bbefttwh"; 
    const DEFAULT_AVATAR = "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f464.png";

    let replyingTo = null; 
    let selectedMsgId = null;
    let selectedMsgSender = null;
    let selectedMsgText = null;
    let tempAvatarUrl = localStorage.getItem('reak_avatar') || ""; 

   
    window.setTheme = (themeName) => {
        document.body.className = themeName;
        localStorage.setItem('reak_theme', themeName);
    };

    window.toggleDarkMode = () => {
        if(document.body.classList.contains('theme-dark')) {
            window.setTheme('theme-blue');
        } else {
            window.setTheme('theme-dark');
        }
    };

   
    const savedTheme = localStorage.getItem('reak_theme') || 'theme-blue';
    document.body.className = savedTheme;

    function setupOnlinePresence() {
        if(!localStorage.getItem('reak_name')) return;

        const userStatusRef = push(ref(db, 'online_users'));
        const connectedRef = ref(db, '.info/connected');
        
        onValue(connectedRef, (snap) => {
            if (snap.val() === true) {
                onDisconnect(userStatusRef).remove();
                set(userStatusRef, {
                    name: localStorage.getItem('reak_name'),
                    timestamp: Date.now()
                });
            }
        });

        const onlineUsersRef = ref(db, 'online_users');
        onValue(onlineUsersRef, (snapshot) => {
            const count = snapshot.exists() ? snapshot.size : 0;
            document.getElementById('online-count').innerText = `កំពុងអនឡាញ: ${count} នាក់`;
        });
    }

    window.previewAvatar = async (e, previewId) => {
        const file = e.target.files[0];
        if(!file) return;

        document.getElementById(previewId).src = URL.createObjectURL(file);

        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', UPLOAD_PRESET);

        try {
            const res = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`;
            const response = await fetch(res, { method: 'POST', body: formData });
            const data = await response.json();
            if(data.secure_url) {
                tempAvatarUrl = data.secure_url;
            } else {
                alert("បញ្ជូនរូបភាពប្រវត្តិរូបមិនជោគជ័យទៅកាន់ Cloudinary!");
            }
        } catch(err) {
            console.error(err);
            alert("Network Error: មិនអាច Upload រូបភាពបានទេ!");
        }
    };

    window.login = () => {
        const name = document.getElementById('login-name').value;
        if(name.trim()) {
            localStorage.setItem('reak_name', name);
            localStorage.setItem('reak_avatar', tempAvatarUrl || DEFAULT_AVATAR);
            document.getElementById('login-screen').style.display = 'none';
            updateHeaderProfile();
            setupOnlinePresence();
        } else {
            alert("សូមបញ្ចូលឈ្មោះរបស់អ្នក!");
        }
    };

    if(localStorage.getItem('reak_name')) {
        document.getElementById('login-screen').style.display = 'none';
        if(!localStorage.getItem('reak_avatar') || localStorage.getItem('reak_avatar') === "undefined") {
            localStorage.setItem('reak_avatar', DEFAULT_AVATAR);
        }
        updateHeaderProfile();
        setupOnlinePresence();
    }

    function updateHeaderProfile() {
        const name = localStorage.getItem('reak_name');
        const avatar = localStorage.getItem('reak_avatar') || DEFAULT_AVATAR;
        document.getElementById('header-name').innerText = name;
        document.getElementById('header-avatar').src = avatar;
    }

    window.openSettingsModal = () => {
        document.getElementById('edit-name-input').value = localStorage.getItem('reak_name') || '';
        const currentAvatar = localStorage.getItem('reak_avatar') || DEFAULT_AVATAR;
        document.getElementById('edit-avatar-preview').src = currentAvatar;
        tempAvatarUrl = currentAvatar; 
        document.getElementById('settings-modal').style.display = 'flex';
    };

    window.closeSettingsModal = () => {
        document.getElementById('settings-modal').style.display = 'none';
    };

    window.saveProfileChanges = () => {
        const newName = document.getElementById('edit-name-input').value.trim();
        if(newName) {
            localStorage.setItem('reak_name', newName);
            localStorage.setItem('reak_avatar', tempAvatarUrl || DEFAULT_AVATAR);
            updateHeaderProfile();
            closeSettingsModal();
            location.reload();
        } else {
            alert("សូមបញ្ចូលឈ្មោះរបស់អ្នក!");
        }
    };

    window.sendMessage = () => {
        const name = localStorage.getItem('reak_name');
        const avatar = localStorage.getItem('reak_avatar') || DEFAULT_AVATAR;
        const input = document.getElementById('msg-input');
        if(input.value.trim()) {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            let messageData = { 
                sender: name, 
                avatar: avatar,
                text: input.value, 
                type: 'text', 
                time: time 
            };

            if(replyingTo) {
                messageData.replyTo = replyingTo;
            }

            push(chatRef, messageData);
            input.value = "";
            cancelReply();
        }
    };

    document.getElementById('msg-input').onkeypress = (e) => { if(e.key === 'Enter') window.sendMessage(); };

    window.uploadFile = async (e) => {
        const file = e.target.files[0];
        if(!file) return;

        const name = localStorage.getItem('reak_name');
        const avatar = localStorage.getItem('reak_avatar') || DEFAULT_AVATAR;
        const loadingBar = document.getElementById('loading-bar');
        const inputField = document.getElementById('msg-input');

        loadingBar.style.display = 'block';
        inputField.disabled = true;

        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', UPLOAD_PRESET);

        try {
            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, {
                method: 'POST',
                body: formData
            });

            const data = await res.json();
            
            if(data.secure_url) {
                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                let fileType = data.resource_type;
                if(fileType !== 'image' && fileType !== 'video') {
                    fileType = file.type.startsWith('video') ? 'video' : 'image';
                }
                
                let messageData = { 
                    sender: name, 
                    avatar: avatar,
                    url: data.secure_url, 
                    type: fileType, 
                    time: time 
                };

                if(replyingTo) {
                    messageData.replyTo = replyingTo;
                }

                await push(chatRef, messageData);
                cancelReply();
            } else {
                alert("ការផ្ញើបរាជ័យ៖ " + (data.error ? data.error.message : "ពិនិត្យការកំណត់ Cloudinary"));
            }
        } catch (err) {
            console.error(err);
            alert("Network Error: ផ្ញើមិនចេញទេ!");
        } finally {
            loadingBar.style.display = 'none';
            inputField.disabled = false;
            e.target.value = ''; 
        }
    };

    window.openActionMenu = (msgId, sender, textContent) => {
        selectedMsgId = msgId;
        selectedMsgSender = sender;
        replyingTo = textContent;
        selectedMsgText = textContent;

        const myName = localStorage.getItem('reak_name');
        const delBtn = document.getElementById('btn-del');
        
        if(sender === myName) {
            delBtn.style.display = 'block';
        } else {
            delBtn.style.display = 'none';
        }

        document.getElementById('action-menu').style.display = 'flex';
    };

    window.closeActionMenu = () => {
        document.getElementById('action-menu').style.display = 'none';
    };

    window.openEmojiPickerFromMenu = () => {
        window.closeActionMenu();
        document.getElementById('emoji-picker-menu').style.display = 'flex';
    };

    window.closeEmojiPicker = () => {
        document.getElementById('emoji-picker-menu').style.display = 'none';
    };

    window.addReaction = (emoji) => {
        if(!selectedMsgId) return;
        const myName = localStorage.getItem('reak_name');
        
        onValue(ref(db, `global_messages/${selectedMsgId}`), (snapshot) => {
            const msgData = snapshot.val();
            let reactions = msgData && msgData.reactions ? msgData.reactions : {};

            if(reactions[myName] === emoji) {
                delete reactions[myName];
            } else {
                reactions[myName] = emoji;
            }

            update(ref(db, `global_messages/${selectedMsgId}`), { reactions: reactions });
        }, { onlyOnce: true });

        window.closeEmojiPicker();
    };

    window.triggerReply = () => {
        document.getElementById('reply-to-text').innerText = `${selectedMsgSender}: "${replyingTo}"`;
        document.getElementById('reply-banner').style.display = 'flex';
        window.closeActionMenu();
        document.getElementById('msg-input').focus();
    };

    window.cancelReply = () => {
        replyingTo = null;
        document.getElementById('reply-banner').style.display = 'none';
    };

    window.triggerDelete = () => {
        if(selectedMsgId) {
            const msgRef = ref(db, `global_messages/${selectedMsgId}`);
            remove(msgRef).then(() => {
                window.closeActionMenu();
            }).catch((err) => {
                alert("លុបមិនបានទេ៖ " + err.message);
            });
        }
    };

    window.showProfile = (name, avatar) => {
        document.getElementById('modal-name').innerText = name;
        document.getElementById('modal-avatar').src = avatar || DEFAULT_AVATAR;
        document.getElementById('profile-modal').style.display = 'flex';
    };

    window.closeProfileModal = () => {
        document.getElementById('profile-modal').style.display = 'none';
    };

    function renderMessage(snapshot) {
        const data = snapshot.val();
        const msgId = snapshot.key;
        const myName = localStorage.getItem('reak_name');
        const isMe = data.sender === myName;
        
        let rowDiv = document.getElementById(`msg-${msgId}`);
        if(!rowDiv) {
            rowDiv = document.createElement('div');
            rowDiv.className = `message-row ${isMe ? 'sent-row' : 'received-row'}`;
            rowDiv.id = `msg-${msgId}`;
            document.getElementById('chat-container').appendChild(rowDiv);
        }
        
        const avatarUrl = data.avatar || DEFAULT_AVATAR;
        const escapedName = data.sender.replace(/'/g, "\\'");
        const escapedAvatar = avatarUrl.replace(/'/g, "\\'");

        let content = `<img class="chat-avatar" src="${avatarUrl}" onerror="this.src='${DEFAULT_AVATAR}'" onclick="showProfile('${escapedName}', '${escapedAvatar}')">`;
        content += `<div class="message-wrapper">`;
        content += `<div class="sender-name" onclick="showProfile('${escapedName}', '${escapedAvatar}')">${isMe ? 'ខ្ញុំ' : data.sender}</div>`;
        content += `<div class="message" onclick="openActionMenu('${msgId}', '${escapedName}', '${data.text ? data.text.replace(/'/g, "\\'") : (data.type === 'image' ? '[រូបភាព]' : '[វីដេអូ]')}')">`;
        
        if(data.replyTo) {
            content += `<div class="replied-box">↩ តបទៅ៖ ${data.replyTo}</div>`;
        }

        if(data.type === 'text') {
            content += `<span>${data.text}</span>`;
        } else if(data.type === 'image') {
            content += `<img class="chat-media" src="${data.url}" loading="lazy" onclick="event.stopPropagation(); window.open('${data.url}', '_blank')">`;
        } else if(data.type === 'video') {
            content += `<video src="${data.url}" controls></video>`;
        }
        
        if(data.reactions) {
            content += `<div class="reaction-container">`;
            let emojiGroups = {};
            for(let user in data.reactions) {
                let emj = data.reactions[user];
                if(!emojiGroups[emj]) emojiGroups[emj] = [];
                emojiGroups[emj].push(user);
            }

            for(let emj in emojiGroups) {
                let usersList = emojiGroups[emj].join(', ');
                let hasLiked = emojiGroups[emj].includes(myName);
                content += `<span class="reaction-pill ${hasLiked ? 'active' : ''}" title="អ្នកដាក់៖ ${usersList}" onclick="event.stopPropagation(); selectedMsgId='${msgId}'; addReaction('${emj}');">${emj} ${emojiGroups[emj].length}</span>`;
            }
            content += `</div>`;
        }
        
        content += `<span class="msg-time">${data.time || ''}</span></div></div>`;
        rowDiv.innerHTML = content;
    }

    onChildAdded(chatRef, (snapshot) => {
        renderMessage(snapshot);
        const container = document.getElementById('chat-container');
        container.scrollTop = container.scrollHeight;
    });

    onChildChanged(chatRef, (snapshot) => {
        renderMessage(snapshot);
    });

    onChildRemoved(chatRef, (snapshot) => {
        const msgId = snapshot.key;
        const msgElement = document.getElementById(`msg-${msgId}`);
        if(msgElement) {
            msgElement.remove();
        }
    });
</script>
</body>
</html>
